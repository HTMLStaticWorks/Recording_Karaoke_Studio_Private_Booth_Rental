<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Resonance Karaoke</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#9333ea',
                        secondary: '#ec4899',
                        dark: '#0f172a',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body class="antialiased bg-gray-50 dark:bg-dark text-gray-900 dark:text-gray-100 min-h-screen flex flex-col items-center justify-center relative overflow-hidden transition-colors duration-300 py-12">

    <!-- Background Elements -->
    <div class="absolute inset-0 z-0">
        <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=1974&auto=format&fit=crop" alt="Background" class="w-full h-full object-cover opacity-10">
        <div class="absolute top-0 right-0 w-[500px] h-[500px] bg-primary/20 rounded-full blur-[100px] translate-x-1/2 -translate-y-1/2"></div>
        <div class="absolute bottom-0 left-0 w-[500px] h-[500px] bg-secondary/20 rounded-full blur-[100px] -translate-x-1/2 translate-y-1/2"></div>
    </div>

    <div class="w-full max-w-md px-4 flex justify-end mb-4 relative z-20 gap-2">
        <button class="theme-toggle w-12 h-12 flex items-center justify-center rounded-full glass-card hover:bg-white/20 transition-colors shadow-lg text-primary" aria-label="Toggle Theme">
            <i class="fa-solid fa-moon dark:hidden text-lg"></i>
            <i class="fa-solid fa-sun hidden dark:block text-yellow-400 text-lg"></i>
        </button>
        <button class="rtl-toggle w-12 h-12 flex items-center justify-center rounded-full glass-card hover:bg-white/20 transition-colors shadow-lg text-primary text-sm font-bold" aria-label="Toggle RTL">
            <i class="fa-solid fa-arrow-right-arrow-left"></i>
        </button>
    </div>

    <div class="w-full max-w-md px-4 relative z-10 animate-[float_4s_ease-in-out_infinite]">
        <div class="glass-card bg-white/80 dark:bg-gray-900/80 p-8 shadow-2xl backdrop-blur-2xl border-white/20 dark:border-gray-800">
            
            <!-- Logo -->
            <div class="text-center mb-8">
                <a href="index.html" class="inline-flex items-center gap-3 justify-center group mb-4">
                    <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-primary to-secondary flex items-center justify-center text-white relative overflow-hidden group-hover:shadow-[0_0_15px_rgba(147,51,234,0.5)] transition-all">
                        <i class="fa-solid fa-microphone-lines text-2xl"></i>
                    </div>
                    <span class="font-heading font-bold text-2xl tracking-tight">Resonance</span>
                </a>
                <h2 class="font-heading text-2xl font-bold">Welcome Back</h2>
                <p class="text-gray-500 dark:text-gray-400 text-sm">Log in to manage your bookings and songs.</p>
            </div>

            <form action="dashboard.html" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium mb-1">Email</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-envelope text-gray-400"></i>
                        </div>
                        <input type="email" required placeholder="you@example.com" class="w-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg pl-10 pr-4 py-3 outline-none focus:border-primary transition-colors">
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-sm font-medium">Password</label>
                    </div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-lock text-gray-400"></i>
                        </div>
                        <input type="password" id="password" required placeholder="••••••••" class="w-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg pl-10 pr-10 py-3 outline-none focus:border-primary transition-colors">
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer" onclick="togglePassword()">
                            <i class="fa-regular fa-eye text-gray-400 hover:text-primary transition-colors" id="toggleIcon"></i>
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input type="checkbox" id="remember" class="w-4 h-4 rounded border-gray-300 text-primary focus:ring-primary">
                        <label for="remember" class="ml-2 text-sm text-gray-600 dark:text-gray-400">Remember me</label>
                    </div>
                    <a href="forgot-password.html" class="text-xs font-bold text-primary hover:text-secondary transition-colors">Forgot Password?</a>
                </div>
                <button type="submit" class="w-full btn-primary py-3 rounded-lg font-bold">Log In</button>
            </form>

            <div class="mt-6">
                <div class="relative">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-200 dark:border-gray-700"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-white dark:bg-gray-900 text-gray-500 rounded-full text-xs">Or continue with</span>
                    </div>
                </div>

                <div class="mt-6 grid grid-cols-3 gap-3">
                    <a href="#" class="w-full inline-flex justify-center py-2 px-4 border border-gray-200 dark:border-gray-700 rounded-lg bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700 hover:-translate-y-1 hover:shadow-md transition-all shadow-sm">
                        <i class="fa-brands fa-google text-red-500 text-lg"></i>
                    </a>
                    <a href="#" class="w-full inline-flex justify-center py-2 px-4 border border-gray-200 dark:border-gray-700 rounded-lg bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700 hover:-translate-y-1 hover:shadow-md transition-all shadow-sm">
                        <i class="fa-brands fa-facebook text-blue-600 text-lg"></i>
                    </a>
                    <a href="#" class="w-full inline-flex justify-center py-2 px-4 border border-gray-200 dark:border-gray-700 rounded-lg bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700 hover:-translate-y-1 hover:shadow-md transition-all shadow-sm">
                        <i class="fa-brands fa-apple text-gray-900 dark:text-white text-lg"></i>
                    </a>
                </div>
            </div>

            <p class="mt-8 text-center text-sm text-gray-600 dark:text-gray-400">
                Don't have an account? 
                <a href="signup.html" class="font-bold text-primary hover:text-secondary transition-colors">Create one</a>
            </p>
        </div>
    </div>

    <script src="assets/js/theme.js"></script>
    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
