<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Resonance Karaoke</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#9333ea',
                        secondary: '#ec4899',
                        dark: '#0f172a',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body class="antialiased bg-gray-50 dark:bg-dark text-gray-900 dark:text-gray-100 min-h-screen flex flex-col items-center justify-center relative overflow-hidden transition-colors duration-300 py-12">

    <div class="absolute inset-0 z-0 fixed">
        <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=1974&auto=format&fit=crop" alt="Background" class="w-full h-full object-cover opacity-10">
        <div class="absolute top-0 right-0 w-[500px] h-[500px] bg-primary/20 rounded-full blur-[100px] translate-x-1/2 -translate-y-1/2"></div>
        <div class="absolute bottom-0 left-0 w-[500px] h-[500px] bg-secondary/20 rounded-full blur-[100px] -translate-x-1/2 translate-y-1/2"></div>
    </div>

    <div class="w-full max-w-md px-4 flex justify-end mb-4 relative z-20 gap-2">
        <button class="theme-toggle w-12 h-12 flex items-center justify-center rounded-full glass-card hover:bg-white/20 transition-colors shadow-lg text-primary" aria-label="Toggle Theme">
            <i class="fa-solid fa-moon dark:hidden text-lg"></i>
            <i class="fa-solid fa-sun hidden dark:block text-yellow-400 text-lg"></i>
        </button>
        <button class="rtl-toggle w-12 h-12 flex items-center justify-center rounded-full glass-card hover:bg-white/20 transition-colors shadow-lg text-primary text-sm font-bold" aria-label="Toggle RTL">
            <i class="fa-solid fa-arrow-right-arrow-left"></i>
        </button>
    </div>

    <div class="w-full max-w-md px-4 relative z-10 animate-[float_4s_ease-in-out_infinite]">
        <div class="glass-card bg-white/80 dark:bg-gray-900/80 p-8 shadow-2xl backdrop-blur-2xl border-white/20 dark:border-gray-800 text-center">
            
            <a href="index.html" class="inline-flex items-center gap-3 justify-center group mb-4">
                <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-primary to-secondary flex items-center justify-center text-white relative overflow-hidden group-hover:shadow-[0_0_15px_rgba(147,51,234,0.5)] transition-all">
                    <i class="fa-solid fa-microphone-lines text-2xl"></i>
                </div>
                <span class="font-heading font-bold text-2xl tracking-tight">Resonance</span>
            </a>
            
            <h2 class="font-heading text-2xl font-bold mb-2">Reset Password</h2>
            <p class="text-gray-500 dark:text-gray-400 text-sm mb-8">Enter the email address associated with your account and we'll send you a link to reset your password.</p>

            <form action="login.html" class="space-y-5 text-left">
                <div>
                    <label class="block text-sm font-medium mb-1">Email Address</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-envelope text-gray-400"></i>
                        </div>
                        <input type="email" required placeholder="you@example.com" class="w-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg pl-10 pr-4 py-3 outline-none focus:border-primary transition-colors">
                    </div>
                </div>

                <button type="submit" class="w-full btn-primary py-3 rounded-lg font-bold">Send Reset Link</button>
            </form>

            <p class="mt-8 text-center text-sm text-gray-600 dark:text-gray-400">
                Remember your password? 
                <a href="login.html" class="font-bold text-primary hover:text-secondary transition-colors">Log In</a>
            </p>
        </div>
    </div>

    <script src="assets/js/theme.js"></script>
</body>
</html>
