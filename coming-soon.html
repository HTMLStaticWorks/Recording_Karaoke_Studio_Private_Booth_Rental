<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | Resonance Karaoke</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#9333ea',
                        secondary: '#ec4899',
                        dark: '#0f172a',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
</head>
<body class="antialiased bg-dark text-white min-h-screen flex flex-col relative overflow-hidden">
    
    <div class="absolute inset-0 z-0">
        <img src="https://images.unsplash.com/photo-1571330735066-03aaa9428587?q=80&w=2070&auto=format&fit=crop" alt="DJ Background" class="w-full h-full object-cover opacity-30 mix-blend-screen">
        <div class="absolute inset-0 bg-gradient-to-b from-dark via-dark/80 to-dark"></div>
    </div>

    <!-- Header (Consistent) -->
    <header class="w-full top-0 z-50 relative p-6">
        <a href="index.html" class="flex items-center gap-3 group w-fit mx-auto md:mx-0">
            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-primary to-secondary flex items-center justify-center text-white relative overflow-hidden group-hover:shadow-[0_0_15px_rgba(147,51,234,0.5)] transition-all">
                <i class="fa-solid fa-microphone-lines text-xl"></i>
            </div>
            <span class="font-heading font-bold text-2xl tracking-tight">Resonance</span>
        </a>
    </header>

    <main class="flex-grow flex items-center justify-center relative z-10 px-4">
        <div class="text-center max-w-2xl">
            <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/10 border border-white/20 text-xs font-semibold uppercase tracking-wider text-primary mb-6 animate-pulse">
                New Location
            </div>
            <h1 class="font-heading text-5xl md:text-7xl font-bold mb-6">Tuning the <span class="text-gradient">Mics.</span></h1>
            <p class="text-gray-400 mb-10 text-lg md:text-xl">Something massive is dropping soon. Enter your email below to get VIP early access when we launch.</p>
            
            <form class="flex flex-col sm:flex-row gap-3 max-w-md mx-auto">
                <input type="email" required placeholder="Enter your email" class="flex-grow bg-white/10 border border-white/20 rounded-full px-6 py-3 outline-none focus:border-primary text-white backdrop-blur-md">
                <button type="submit" class="btn-primary px-8 py-3 rounded-full font-bold">Notify Me</button>
            </form>
            
            <div class="flex gap-6 justify-center mt-12 text-gray-400">
                <a href="#" class="hover:text-primary transition-colors text-xl"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" class="hover:text-primary transition-colors text-xl"><i class="fa-brands fa-tiktok"></i></a>
                <a href="#" class="hover:text-primary transition-colors text-xl"><i class="fa-brands fa-twitter"></i></a>
            </div>
        </div>
    </main>

</body>
</html>
